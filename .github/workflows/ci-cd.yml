name: CI/CD for Next.js

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [production, staging]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        npm install
        npm run build

    - name: Deploy to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        VPS_KEY: ${{ secrets.VPS_KEY }}
        PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        STAGING_PATH: ${{ secrets.STAGING_PATH }}
      run: |
        echo "$VPS_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        if [ "${{ matrix.environment }}" == "production" ]; then
          scp -i ~/.ssh/id_rsa -r ./* $VPS_USER@$VPS_HOST:$PRODUCTION_PATH
          ssh -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST "cd $PRODUCTION_PATH && npm install && pm2 restart production"
        else
          scp -i ~/.ssh/id_rsa -r ./* $VPS_USER@$VPS_HOST:$STAGING_PATH
          ssh -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST "cd $STAGING_PATH && npm install && pm2 restart staging"
        fi

    - name: Restart PM2 Processes
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        VPS_KEY: ${{ secrets.VPS_KEY }}
      run: |
        echo "$VPS_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        # Restart PM2 processes
        if [ "${{ matrix.environment }}" == "production" ]; then
          ssh -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST "pm2 restart production"
        else
          ssh -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST "pm2 restart staging"
        fi
